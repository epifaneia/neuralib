{% extends "library/base.html" %}
{# Login, sign-up and logout pages from django-allauth, inside the site layout. #}
{# allauth renders plain inputs and buttons; this gives them the Bootstrap look. #}
{% block extra_head %}
<style>
    main form { max-width: 28rem; }
    main form label { display: block; margin-bottom: .25rem; }
    main form input:not([type=checkbox]):not([type=radio]):not([type=hidden]) {
        display: block; width: 100%; padding: .375rem .75rem;
        border: 1px solid var(--bs-border-color); border-radius: var(--bs-border-radius);
    }
    main form button {
        padding: .375rem .75rem; border: 0; border-radius: var(--bs-border-radius);
        background: var(--bs-primary); color: #fff;
    }
    main ul.errorlist { color: var(--bs-danger); padding-left: 1rem; margin-bottom: .25rem; }
</style>
{% endblock extra_head %}
